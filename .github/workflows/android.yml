name: Android build

on:
  push:
    branches:
      - arena/482428a2-live-vip
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || test -x "${ANDROID_HOME}/tools/bin/sdkmanager" || command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and assemble unsigned release APK
        run: gradle clean test assembleRelease --no-daemon

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: live-vip-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
