name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect preinstalled Android SDK
        run: |
          echo "::notice::ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "::notice::sdkmanager=$(command -v sdkmanager || echo missing)"
          echo "::notice::platforms=$(ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::build-tools=$(ls "${ANDROID_HOME:-/nonexistent}/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Install missing Android SDK components
        continue-on-error: true
        run: |
          SDKM="$(command -v sdkmanager || ls "${ANDROID_HOME}"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || true)"
          echo "::notice::using $SDKM"
          set -o pipefail
          yes | "$SDKM" --licenses > sdk-licenses.log 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > sdk-install.log 2>&1 || echo "::error::sdkmanager failed"
          tail -n 15 sdk-install.log | while IFS= read -r line; do echo "::error::sdk: $line"; done

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Build debug and release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Report failure details
        if: failure()
        run: |
          for f in unit-tests.log build.log; do
            [ -f "$f" ] || continue
            grep -E "^e: |error:|FAILED|What went wrong|Exception|expected|Caused by" "$f" | head -n 40 | while IFS= read -r line; do
              echo "::error::${f}: ${line}"
            done
          done

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LiveVip-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/LiveVip-release.apk
          ls -la dist

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            unit-tests.log
            build.log
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiveVip-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish downloadable dev build (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-${GITHUB_REF_NAME//\//-}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Dev build ($GITHUB_REF_NAME)" \
              --notes "Automated APKs for branch $GITHUB_REF_NAME at commit $GITHUB_SHA. The release APK is signed with the debug key for sideloading."
          fi
          gh release upload "$TAG" dist/LiveVip-debug.apk dist/LiveVip-release.apk --clobber
