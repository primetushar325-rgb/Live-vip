name: Build Live VIP APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug + signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/LiveVIP-v1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/LiveVIP-v1.0.0-release.apk
          ls -la out/

      - name: Verify release APK signature
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs out/LiveVIP-v1.0.0-release.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveVIP-debug-apk
          path: out/LiveVIP-v1.0.0-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveVIP-release-apk
          path: out/LiveVIP-v1.0.0-release.apk

      - name: Publish APKs to GitHub Release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Live VIP APK build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }} (branch ${{ github.ref_name }}). Contains debug and signed release APKs." \
            --target "${{ github.sha }}" \
            out/LiveVIP-v1.0.0-debug.apk out/LiveVIP-v1.0.0-release.apk
