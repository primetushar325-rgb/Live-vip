plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.livevip.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.livevip.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // Demo self-signed key committed for reproducible builds.
            // Replace with your own private keystore for store distribution.
            storeFile file("../keystore/livevip-release.p12")
            storeType "PKCS12"
            storePassword "livevip123"
            keyAlias "livevip"
            keyPassword "livevip123"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Maintained streaming engine: camera capture, HW H.264/AAC encoding,
    // FLV muxing and RTMP/RTMPS client (pedroSG94 RootEncoder).
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
}
