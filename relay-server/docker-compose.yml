services:
  live-vip-relay:
    build: .
    # image: ghcr.io/youruser/live-vip-relay  # or prebuilt
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (phone → relay)
      - "8080:8080"   # Control API (put behind HTTPS via your reverse proxy)
    environment:
      # Generate with: openssl rand -hex 24
      RELAY_TOKEN: "change-me-to-a-strong-random-token"
      # Advertised ingest host (the phone connects to this):
      RTMP_PUBLIC_HOST: "relay.example.com"
      # RTMP_PUBLIC_HOST_PORT: "1935"
